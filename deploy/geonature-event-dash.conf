# Configuration Apache pour servir l'app sous https://<domaine>/event-dash/
# À placer dans /etc/apache2/conf-available/ puis : sudo a2enconf geonature-event-dash
# Modules requis : sudo a2enmod proxy proxy_http
# Dans config.py : URL_PREFIX = "/event-dash/"

<Location /event-dash/>
    ProxyPass http://127.0.0.1:8050/
    ProxyPassReverse http://127.0.0.1:8050/
</Location>

# Redirige /event-dash vers /event-dash/
RedirectMatch ^/event-dash$ /event-dash/
